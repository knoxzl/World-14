# Copy a recipe, give it a unique id, and change biome/dayNight to add a new planet.
# Durations and offsets are seconds of simulation time, independent of sector days.
- type: planet14Planet
  id: Planet14Starter
  name: Basirath starter planet
  biomeName: Temperate grasslands
  description: A quiet refuge of forests and mineral outcrops. Build a future while there is still time.
  spacePosition: 0,0
  spaceSpriteState: starter
  biome: Planet14StarterTerrain
  seed: 14
  ambientLight: "#D8B059"
  dayNight:
    duration: 1800 # 30-minute sunrise-to-sunrise cycle
    offset: 900 # Midday phase offset relative to the round clock
    dayFraction: 0.8 # About 24 minutes daylight, 6 minutes night.
    minLightLevel: 0.45
    minLevel: "#99A6CC"
    maxLightLevel: 3
    clipLight: 1.25

- type: planet14Planet
  id: Planet14Barren
  name: Basirath barren planet
  biomeName: Barren asteroid terrain
  description: A silent rocky world rich in salvage possibilities, far from the comforts of home.
  spacePosition: 600,300
  spaceSpriteState: barren
  biome: Asteroid
  ambientLight: "#9AA7B5"
  dayNight:
    duration: 3600
    offset: 1800
    minLightLevel: 0.02

# The last matching tile layer wins. Put fallback ground before terrain patches.
# Higher noise thresholds produce sparser patches; lower frequency makes larger patches.
- type: biomeTemplate
  id: Planet14StarterTerrain
  layers:
  - !type:BiomeTileLayer
    threshold: -1
    tile: FloorPlanetGrass
  - !type:BiomeTileLayer
    threshold: 0.4
    tile: FloorPlanetDirt
    noise:
      seed: 2
      frequency: 0.04
      noiseType: OpenSimplex2
  - !type:BiomeEntityLayer
    allowedTiles:
    - FloorPlanetGrass
    threshold: 0.75
    noise:
      seed: 0
      frequency: 0.8
      noiseType: OpenSimplex2
    entities:
    - FloraTree
    - FloraTreeLarge
  - !type:BiomeEntityLayer
    allowedTiles:
    - FloorPlanetGrass
    - FloorPlanetDirt
    threshold: 0.85
    noise:
      seed: 1
      frequency: 0.4
      noiseType: OpenSimplex2
    entities:
    - FloraRockSolid
  # Small, occasional mountains. This mask confines both rock and ore to outcrops.
  - !type:BiomeMetaLayer
    template: Planet14StarterMountains
    threshold: 0.82
    noise:
      seed: 7
      frequency: 0.065
      noiseType: OpenSimplex2

- type: biomeTemplate
  id: Planet14StarterMountains
  layers:
  - !type:BiomeEntityLayer
    allowedTiles: [FloorPlanetGrass, FloorPlanetDirt]
    threshold: -1
    entities:
    - WallRock
  # Separate noise makes connected ore pockets within the mountain footprint.
  - !type:BiomeEntityLayer
    allowedTiles: [FloorPlanetGrass, FloorPlanetDirt]
    threshold: 0.6
    noise:
      seed: 8
      frequency: 0.23
      noiseType: OpenSimplex2
    entities:
    - WallRockTin # Smelts into steel.
  - !type:BiomeEntityLayer
    allowedTiles: [FloorPlanetGrass, FloorPlanetDirt]
    threshold: 0.65
    noise:
      seed: 9
      frequency: 0.23
      noiseType: OpenSimplex2
    entities:
    - WallRockCoal
  - !type:BiomeEntityLayer
    allowedTiles: [FloorPlanetGrass, FloorPlanetDirt]
    threshold: 0.7
    noise:
      seed: 10
      frequency: 0.23
      noiseType: OpenSimplex2
    entities:
    - WallRockQuartz # Smelts into glass.

